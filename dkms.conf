# ThinkPad T495 (AMD): run the Synaptics touchpad (LEN2062, TM3471) over
# RMI4/SMBus instead of PS/2. Based on
# https://github.com/orospakr/thinkpad-t14-amd-touchpad (patches 0001, 0002),
# reduced to the two loadable modules: psmouse is built into Fedora kernels,
# so InterTouch is enabled with the kernel argument
# psmouse.synaptics_intertouch=1 instead of patching psmouse.
PACKAGE_NAME="thinkpad-t495-touchpad"
PACKAGE_VERSION="0.1"
PRE_BUILD="tools/pre-build.sh ${kernelver}"
PATCH[0]="0001-i2c-piix4-add-SMBus-Host-Notify-through-the-ASF-target-block-on-SMB0001-platforms.patch"
PATCH[1]="0002-Input-synaptics-rmi4-let-the-device-settle-after-the-PS2-reset-on-SMBus-resume.patch"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
BUILT_MODULE_NAME[0]="i2c-piix4"
BUILT_MODULE_LOCATION[0]="drivers/i2c/busses/"
DEST_MODULE_LOCATION[0]="/updates"
BUILT_MODULE_NAME[1]="rmi_smbus"
BUILT_MODULE_LOCATION[1]="drivers/input/rmi4/"
DEST_MODULE_LOCATION[1]="/updates"
AUTOINSTALL="yes"
